spring:
  application:
    name: jpcard

  datasource:
    url: jdbc:h2:mem:jpcard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: true

logging:
  level:
    org.hibernate.SQL: debug

jwt:
