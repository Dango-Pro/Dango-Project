# application-local.yaml 이 있으면 로컬 설정으로 덮어씁니다 (gitignore 대상)
spring:
  profiles:
    include: local
    active: dev # 기본은 'dev'(H2) 모드로 실행
  application:
    name: dango

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:inanasai1101@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

file:
  upload-dir: uploads

jwt:
  secret: ${JWT_SECRET_KEY:this_is_a_temporary_development_secret_key_32chars_long}

groq:
  ai:
    api-key: ${GROQ_API_KEY:}
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile


---
# [모드 1] 개발용 (dev) - H2 메모리 DB
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:jpcard;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# [모드 2] 배포용/MySQL (prod)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://192.168.111.200:3306/dango?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true